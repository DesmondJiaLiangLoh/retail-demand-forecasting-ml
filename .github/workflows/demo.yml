name: Demo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: XGBoost and forecasting validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dependency compatibility
        run: python -m pip check

      - name: Validate XGBoost environment
        run: |
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import scipy; print('SciPy:', scipy.__version__)"
          python -c "import sklearn; print('Scikit-learn:', sklearn.__version__)"
          python -c "import xgboost; print('XGBoost:', xgboost.__version__)"
          python -c "from xgboost import XGBRegressor, XGBClassifier; XGBRegressor(); XGBClassifier(); print('XGBoost estimators OK')"

      - name: Run automated unit tests
        run: python -m unittest discover -s demo -v

      - name: Execute statistical forecasting pipeline
        run: python demo/forecast.py

      - name: Execute XGBoost forecasting pipeline
        run: python demo/xgb_forecast.py
